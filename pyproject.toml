[project]
name = "laserpuzzle"
version = "0.6.0"
description = "Generate laser-cut 3D puzzles (flat parts that assemble into 3D objects) from 3D models, drawings and parameters."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Native-only packages carry `sys_platform != "emscripten"` so the wheel also installs in
    # Pyodide (browser). There the collision check uses manifold's WASM build instead (core/validate.py)
    # and the local web UI (fastapi/uvicorn) isn't used.
    "numpy>=1.24",
    "trimesh>=4.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0; sys_platform != 'emscripten'",   # triangulation for trimesh.extrude_polygon
    "manifold3d>=2.4; sys_platform != 'emscripten'",      # boolean ops for collision checks
    "networkx>=3.0",        # trimesh graph helpers
    "rtree>=1.0; sys_platform != 'emscripten'",
    "ezdxf>=1.1",
    "fastapi>=0.110; sys_platform != 'emscripten'",
    "uvicorn>=0.27; sys_platform != 'emscripten'",
    "python-multipart>=0.0.9; sys_platform != 'emscripten'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
laserpuzzle = "laserpuzzle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laserpuzzle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
